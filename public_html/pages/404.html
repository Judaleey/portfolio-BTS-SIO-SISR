<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Univers Perdu</title>
    <!-- N'oublie pas ton pont Tailwind ici (CDN ou lien absolu vers ton CSS) -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body
    class="m-0 p-0 h-screen bg-[#000] text-white font-sans overflow-hidden flex flex-col justify-center items-center relative">

    <!-- COUCHE 1 : EFFET MATRIX (Z-index à 0 pour rester au fond) -->
    <canvas id="matrix" class="absolute inset-0 pointer-events-none opacity-40 z-0"></canvas>


    <!-- COUCHE 3 : LE CŒUR DE LA SINGULARITÉ -->
    <div
        class="relative z-20 text-center max-w-2xl px-6 backdrop-blur-md bg-[#000]/10 rounded-2xl py-12 border border-white/10 shadow-2xl">
        <h1
            class="text-7xl md:text-9xl font-black mb-4 bg-gradient-to-r from-[#18aeef] to-[#10b981] bg-clip-text text-transparent drop-shadow-lg">
            404
        </h1>
        <p class="text-xl md:text-2xl text-slate-300 mb-8 font-light tracking-wide">
            Vous avez dérivé au-delà des frontières du connu.
        </p>
        <button onclick="window.history.back()"
            class="mt-4 px-8 py-3 bg-[#10b981] hover:bg-[#0d9668] text-white rounded-md font-bold tracking-wider transition-all duration-300 hover:scale-105 shadow-[0_0_15px_rgba(16,185,129,0.5)]">
            Retourner à la lumière
        </button>
    </div>


    <!-- MOTEUR DE LA MATRICE -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const canvas = document.getElementById('matrix');
            if (canvas) {
                const ctx = canvas.getContext('2d');
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;

                // La Matrice purifiée : uniquement des chiffres et des lettres
                const symbols = "0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ".split("");
                const fontSize = 16;
                const columns = canvas.width / fontSize;
                const drops = Array(Math.floor(columns)).fill(1);

                function draw() {
                    ctx.fillStyle = 'rgba(15, 23, 42, 0.1)';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);

                    ctx.fillStyle = '#10b981';
                    ctx.font = fontSize + 'px monospace';

                    drops.forEach((y, i) => {
                        const text = symbols[Math.floor(Math.random() * symbols.length)];
                        const x = i * fontSize;
                        ctx.fillText(text, x, y * fontSize);

                        if (y * fontSize > canvas.height && Math.random() > 0.975) {
                            drops[i] = 0;
                        }
                        drops[i]++;
                    });
                }

                setInterval(draw, 50);
                window.addEventListener('resize', () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                });
            }
        });
    </script>
</body>

</html>
